name: API 37 AVD Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-cmdline-tools-12
            tools_version: '12.0'
            archive_id: '11076708'
            expected_target: 'android-0'
          - label: fixed-cmdline-tools-22
            tools_version: '22.0'
            archive_id: '15859902'
            expected_target: 'android-37.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pinned Android Command-line Tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$HOME/.android/avd" diagnostics

          curl -fL --retry 3 --retry-delay 2 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${{ matrix.archive_id }}_latest.zip" \
            -o "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools-unpacked"
          mv "$RUNNER_TEMP/cmdline-tools-unpacked/cmdline-tools" "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version | tee diagnostics/sdkmanager-version.txt
          cat "$SDK/cmdline-tools/latest/source.properties" | tee diagnostics/cmdline-tools-source.properties

      - name: Install API 37 SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            platform-tools \
            emulator \
            'platforms;android-37.0' \
            'system-images;android-37.0;google_apis;x86_64'

          sdkmanager --list_installed > diagnostics/sdk-packages.txt 2>&1 || true
          emulator -version > diagnostics/emulator-version.txt 2>&1 || true

      - name: Create API 37 AVD
        shell: bash
        run: |
          set -euxo pipefail

          echo no | avdmanager create avd \
            --force \
            --name api37-test \
            --package 'system-images;android-37.0;google_apis;x86_64'

          printf '%s\n' \
            'hw.cpu.ncore=2' \
            'hw.ramSize=4096M' \
            'hw.heapSize=512M' \
            'disk.dataPartition.size=6G' \
            >> "$ANDROID_AVD_HOME/api37-test.avd/config.ini"

          grep -R '^target=' "$ANDROID_AVD_HOME" | tee diagnostics/avd-target.txt || true
          cp "$ANDROID_AVD_HOME/api37-test.ini" diagnostics/avd-root.ini || true
          cp "$ANDROID_AVD_HOME/api37-test.avd/config.ini" diagnostics/avd-config.ini || true

      - name: Validate observed AVD target
        shell: bash
        run: |
          set -euxo pipefail

          observed="$(grep '^target=' "$ANDROID_AVD_HOME/api37-test.ini" | cut -d= -f2-)"
          echo "observed_target=$observed" | tee diagnostics/target-check.txt
          echo "expected_target=${{ matrix.expected_target }}" | tee -a diagnostics/target-check.txt

          if [[ "$observed" != "${{ matrix.expected_target }}" ]]; then
            echo "Observed target differs from the historically reproduced value."
            echo "This can happen if Android tooling behavior changes in the future."
          fi

          if [[ "${{ matrix.tools_version }}" == "22.0" && "$observed" != "android-37.0" ]]; then
            echo "Command-line Tools 22.0 failed to create the expected API 37 target."
            exit 1
          fi

      - name: Launch API 37 emulator
        shell: bash
        run: |
          set -euxo pipefail

          nohup emulator \
            -avd api37-test \
            -no-window \
            -gpu software \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            > diagnostics/emulator-stdout.txt 2>&1 &

          echo $! > diagnostics/emulator.pid

          adb wait-for-device

          booted=0
          for i in $(seq 1 120); do
            value="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$value" == "1" ]]; then
              booted=1
              break
            fi
            sleep 2
          done

          echo "boot_completed=$booted" | tee diagnostics/boot-status.txt

          if [[ "$booted" != "1" ]]; then
            adb logcat -d > diagnostics/boot-failure-logcat.txt 2>&1 || true
            exit 1
          fi

          adb shell getprop ro.build.version.sdk | tee diagnostics/guest-sdk.txt
          adb shell getprop ro.build.version.release | tee diagnostics/guest-release.txt
          adb shell getprop ro.build.id | tee diagnostics/guest-build-id.txt

      - name: Observe SurfaceFlinger
        shell: bash
        env:
          SAMPLES: '18'
          INTERVAL_SECONDS: '10'
        run: |
          bash scripts/observe_surfaceflinger.sh diagnostics

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.label }}"
            echo
            echo "Command-line Tools: ${{ matrix.tools_version }}"
            echo
            echo '### AVD target'
            echo '```text'
            cat diagnostics/avd-target.txt 2>/dev/null || true
            echo '```'
            echo
            echo '### Observation'
            echo '```text'
            cat diagnostics/observation-result.txt 2>/dev/null || true
            echo '```'
            echo
            echo '### Matching crash signatures'
            echo '```text'
            head -n 80 diagnostics/crash-signatures.txt 2>/dev/null || true
            echo '```'
          } | tee diagnostics/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api37-${{ matrix.label }}
          path: diagnostics/
          if-no-files-found: warn
